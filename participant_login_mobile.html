<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Participant Login | ShrIEEEk '26</title>
<!-- Google Fonts: Anton & Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700;800&amp;family=Bebas+Neue&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              yellow: '#F3F000',
              black: '#121212',
              card: '#1B1B1B',
              border: '#2C2C2C',
              muted: '#9E9E9E',
              red: '#FF2A2A',
            }
          },
          fontFamily: {
            comic: ['"Anton"', '"Bebas Neue"', 'Impact', 'sans-serif'],
            sans: ['"Inter"', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'comic-yellow': '4px 4px 0px 0px #F3F000',
            'comic-black': '4px 4px 0px 0px #000000',
            'comic-sm': '2px 2px 0px 0px #F3F000',
            'card-shadow': '0px 10px 30px rgba(0, 0, 0, 0.85)',
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Halftone & Comic Aesthetics -->
<style data-purpose="comic-effects">
    /* Halftone dot pattern overlay for authentic comic feel */
    .halftone-overlay {
      background-image: radial-gradient(#F3F000 0.75px, transparent 0.75px);
      background-size: 14px 14px;
      opacity: 0.12;
    }

    /* Subtle comic panel border lines */
    .comic-border {
      border: 2px solid #2B2B2B;
    }

    .comic-border-yellow {
      border: 2px solid #F3F000;
    }

    /* iOS safe-area handling */
    .safe-top {
      padding-top: env(safe-area-inset-top, 24px);
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }
  </style>
<!-- END: Custom Halftone & Comic Aesthetics -->
</head>
<body class="bg-brand-black text-white font-sans antialiased min-h-screen relative selection:bg-brand-yellow selection:text-black overflow-x-hidden flex flex-col justify-between">
<!-- BEGIN: Background Comic Graphic Artwork Layer -->
<div aria-hidden="true" class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<!-- Battle scene artwork with deep editorial vignette -->
<img alt="Hero battle background" class="w-full h-full object-cover object-center opacity-40 scale-105 filter contrast-125" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB_DweJPKa0CT9DTHEQ5aFbuZiW6c-BqB9Z7OnPJ-h3YVJzSY8Jw1NAMIFFbhfSpMw_Rh39avYFkqS0q_4t7JQdWHfx3-9c5_JaCw3Le7RsgAaxECPTY3bOHT_q4vVTNauRfomBV83dKou1cYwpwMT4Om3YUCvLjYlEnVUcK1dpHRw_ltQHOTBU_XHue6-eOLNqJ90xQTFRxzvJqBcRoAxiDq4ZvJmelnLStiSaJ5loeq_6_eZpN9eoB2XsUfLbh5W8KQ">
<!-- Deep gradient backdrop overlay -->
<div class="absolute inset-0 bg-gradient-to-b from-black/95 via-black/85 to-[#0e0e0e] z-10"></div>
<!-- Halftone comic grid effect -->
<div class="absolute inset-0 halftone-overlay z-20"></div>
</div>
<!-- END: Background Comic Graphic Artwork Layer -->
<!-- BEGIN: Mobile Top Status Bar & Convention Header -->
<header class="relative z-30 w-full px-5 safe-top pt-4" data-purpose="convention-header">
<div class="flex items-center justify-between border-b border-white/10 pb-2">
<!-- Tag / Badge status label -->
<div class="inline-flex items-center gap-2">
<span class="inline-block w-2.5 h-2.5 bg-brand-yellow"></span>
<span class="text-[11px] font-bold tracking-widest text-brand-yellow uppercase font-mono">
          SHRIEEEK '26 • PARTICIPANT ACCESS
        </span>
</div>
<!-- Convention badge identifier -->
<span class="text-[10px] tracking-wider uppercase text-zinc-400 font-mono px-2 py-0.5 bg-black/70 border border-zinc-800">
        SEC-011
      </span>
</div>
</header>
<!-- END: Mobile Top Status Bar & Convention Header -->
<!-- BEGIN: Main Login Content Container -->
<main class="relative z-30 flex-1 flex flex-col justify-center px-5 py-6 max-w-[430px] mx-auto w-full" data-purpose="login-container">
<!-- Outer Comic Frame Card with Signature Yellow Border Accent -->
<div class="relative bg-[#161616]/95 border-2 border-brand-yellow shadow-comic-black rounded-none p-6 md:p-7 backdrop-blur-md">
<!-- BEGIN: Hero Logo Card Container -->
<div class="mb-6" data-purpose="brand-logo-frame"><div class="flex items-center justify-center py-2"><div class="flex items-center justify-center py-2"><img alt="ShrIEEEk '26 Official Logo" class="h-14 w-auto max-w-full object-contain mix-blend-screen" src="https://lh3.googleusercontent.com/aida/AEtjO1U-ciExK8zEUMXl8jTk-MrTql_KOL83WU95IYO6LVJ6UbWzZlLYjzVaJPma1DK5Xk6_t6e-p_v_ZoxHhFTzvgoADmKLd1AZVw0W8jEhXiyj4q_VdjpJRyGNqzPt5IbC8NF2po6lttE2TiRQWpbVdManUQRo3gTQW4Z1bDqWSepvUNRaAHYea5rb0rvqcE6nQSwAvNSq4TqlrtLrr3DFsbyYClKQ62zBwZf37OCRggP-RT42_xxEN4SBGA" style="mix-blend-mode: screen;"></div></div></div>
<!-- END: Hero Logo Card Container -->
<!-- BEGIN: Headings Section -->
<div class="mb-6 space-y-1.5" data-purpose="screen-title">
<h1 class="text-3xl sm:text-4xl font-comic tracking-wider uppercase text-white leading-none">
          WELCOME BACK, HERO!
        </h1>
<p class="text-xs sm:text-sm text-zinc-400 leading-relaxed font-normal">
          Sign in to access your cards, badges, and convention rewards.
        </p>
</div>
<!-- END: Headings Section -->
<!-- BEGIN: Participant Login Form -->
<form class="space-y-4" data-purpose="login-form" onsubmit="event.preventDefault();">
<!-- Field 1: Mobile Phone Number -->
<div class="space-y-1.5" data-purpose="phone-input-field">
<label class="block text-[11px] font-bold text-white tracking-widest uppercase font-mono flex items-center gap-1.5" for="mobile_number">
<span class="w-1.5 h-1.5 bg-brand-yellow inline-block"></span>
            MOBILE PHONE NUMBER
          </label>
<div class="relative">
<!-- Icon prefix -->
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-400">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="w-full pl-10 pr-3.5 py-3 bg-[#1e1e1e] border-2 border-zinc-700 text-white placeholder-zinc-500 text-sm font-mono tracking-wide focus:outline-none focus:border-brand-yellow focus:ring-0 transition-colors" id="mobile_number" placeholder="9876543210" required="" type="tel">
</div>
</div>
<!-- Field 2: Password / Passcode -->
<div class="space-y-1.5 pt-1" data-purpose="password-input-field">
<div class="flex items-center justify-between">
<label class="block text-[11px] font-bold text-white tracking-widest uppercase font-mono flex items-center gap-1.5" for="passcode">
<span class="w-1.5 h-1.5 bg-brand-yellow inline-block"></span>
              PASSWORD / PASSCODE
            </label>
<!-- Forgot passcode link -->
<a class="text-[11px] font-bold text-brand-yellow hover:underline tracking-wider uppercase font-mono transition-opacity hover:opacity-90" href="#">First 5 digits of your phone number<br></a>
</div>
<div class="relative">
<!-- Key / Lock icon prefix -->
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-400">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Input element with password dots preview -->
<input class="w-full pl-10 pr-10 py-3 bg-[#1e1e1e] border-2 border-zinc-700 text-white placeholder-zinc-500 text-sm font-mono tracking-wider focus:outline-none focus:border-brand-yellow focus:ring-0 transition-colors" id="passcode" placeholder="••••••••••••" required="" type="password">
<!-- Password visibility toggle button -->
<button aria-label="Toggle passcode visibility" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-zinc-400 hover:text-white transition-colors" data-purpose="password-visibility-toggle" id="toggle-visibility" type="button">
<svg class="w-4 h-4" fill="none" id="eye-icon" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- Field 3: Remember Device Checkbox -->
<div class="pt-1 flex items-center" data-purpose="remember-me-row">
<label class="inline-flex items-center gap-3 cursor-pointer select-none">
<input class="w-4 h-4 rounded-none bg-[#1e1e1e] border-2 border-zinc-600 text-brand-yellow focus:ring-0 focus:ring-offset-0 focus:border-brand-yellow" id="remember_me" type="checkbox">
<span class="text-[11px] font-bold tracking-wider text-zinc-300 uppercase font-mono">
              REMEMBER ME ON THIS DEVICE
            </span>
</label>
</div>
<!-- Main Action CTA: Sign In -->
<div class="pt-3" data-purpose="submit-button-container">
<button class="w-full py-3.5 bg-brand-yellow hover:bg-[#dedb00] active:translate-y-0.5 text-black font-comic tracking-wider text-xl uppercase flex items-center justify-center gap-2 border-2 border-black shadow-comic-black transition-transform cursor-pointer" type="submit">
<span class="">SIGN IN</span>
<svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</form>
<!-- END: Participant Login Form -->
<!-- BEGIN: Account Registration Auxiliary Box -->
<div class="mt-6 pt-5 border-t border-zinc-800" data-purpose="new-account-section">
<div class="flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
<!-- Label -->
<div class="inline-flex items-center gap-1.5 text-zinc-400">


</div>
<!-- Register Action Box with dynamic comic frame -->

</div>
</div>
<!-- END: Account Registration Auxiliary Box -->
</div>
<!-- End Outer Comic Frame Card -->
</main>
<!-- END: Main Login Content Container -->
<!-- BEGIN: Mobile Footer Security Note -->
<footer class="relative z-30 w-full px-5 pb-4 safe-bottom text-center" data-purpose="footer-info">
<p class="text-[10px] text-zinc-500 font-mono uppercase tracking-wider">
      ENCRYPTED PARTICIPANT PORTAL • IEEE STUDENT BRANCH ARCHIVES
    </p>
</footer>
<!-- END: Mobile Footer Security Note -->
<!-- BEGIN: Interactive Passcode Visibility Script -->
<script data-purpose="event-handlers">
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('toggle-visibility');
      const passInput = document.getElementById('passcode');
      
      if (toggleBtn && passInput) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passInput.type === 'password';
          passInput.type = isPassword ? 'text' : 'password';
          toggleBtn.classList.toggle('text-brand-yellow', isPassword);
          toggleBtn.classList.toggle('text-zinc-400', !isPassword);
        });
      }
    });
  </script>
<!-- END: Interactive Passcode Visibility Script -->






</body></html>
